<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>to-do</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">

<style>
:root{--pink:#f9e4e7;--pink-d:#ebc6cd;--peach:#fde6d6;--peach-d:#f1caae;--beige:#f5ebdd;--beige-d:#d9c7ae;--ink:#5b4a44;--soft:#a08c80;--f:Helvetica,"Helvetica Neue",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;text-transform:lowercase;font-weight:400;font-family:var(--f)}
input::-webkit-datetime-edit,input::-webkit-datetime-edit-fields-wrapper,input::-webkit-datetime-edit-text,input::-webkit-datetime-edit-day-field,input::-webkit-datetime-edit-month-field,input::-webkit-datetime-edit-year-field{font-family:var(--f);font-weight:400}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--ink);font-size:12px}
.wrap{max-width:460px;margin:0 auto;padding:30px 18px 40px}
.prog{margin-bottom:6px}
.bar{height:12px;background:var(--beige);border-radius:999px;overflow:hidden;border:1.5px solid var(--beige-d)}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--pink-d),var(--peach-d));border-radius:999px;transition:width .4s}
.plabel{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);margin-top:6px}
.deco{text-align:center;color:var(--ink);font-size:16px;font-weight:100;letter-spacing:.1em;margin:8px 0 12px;opacity:.85}
.card{border:2px dashed var(--beige-d);border-radius:20px;padding:14px}
.row{display:flex;gap:8px;margin-bottom:8px}
input[type=text],input[type=date]{min-width:0;border:1.5px solid var(--beige-d);background:var(--beige);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:12px;outline:none}
input[type=text]{flex:1}
input:focus{border-color:var(--pink-d)}
input[type=date]{color:var(--soft)}
.btn{border:0;background:var(--pink-d);color:var(--ink);font-size:12px;border-radius:10px;padding:0 14px;cursor:pointer}
.btn:active{transform:scale(.96)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.chip{border:1.5px solid var(--beige-d);background:#fff;color:var(--soft);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
.chip.on{background:var(--peach);border-color:var(--peach-d);color:var(--ink)}
.sec{margin-top:14px}
.sec h2{margin:0;background:var(--pink);color:var(--ink);font-size:12px;letter-spacing:.08em;padding:6px 10px;border-bottom:2px solid var(--pink-d);display:flex;justify-content:space-between;border-radius:8px 8px 0 0}
.item{display:flex;align-items:center;gap:10px;padding:7px 6px;border-bottom:1.5px dashed var(--beige-d);font-size:12px}
.item span.t{flex:1;overflow-wrap:anywhere}
.due{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--beige);color:var(--soft);white-space:nowrap}
.due.soon{background:var(--peach);color:var(--ink)}
.due.late{background:var(--pink-d);color:var(--ink)}
.cb{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--pink-d);border-radius:5px;background:#fff;cursor:pointer;flex:none;display:grid;place-content:center}
.cb:checked{background:var(--pink-d)}
.cb:checked::after{content:"✓";color:var(--ink);font-size:11px}
.x{border:0;background:none;color:var(--beige-d);cursor:pointer;font-size:16px}
.empty{color:var(--beige-d);padding:8px 6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="prog"><div class="bar"><div class="fill" id="fill"></div></div><div class="plabel"><span id="pl">0 / 0 done</span><span id="pp">0%</span></div></div>
  <div class="deco">𓂃۶ৎ</div>
  <div class="card">
    <div class="row"><input type="text" id="in" placeholder="add a task…" maxlength="120" autocomplete="off"><button class="btn" id="go">add</button></div>
    <div class="chips" id="chips"></div>
    <div class="row" style="margin-top:6px"><input type="date" id="due" aria-label="due date"></div>
    <div id="lists"></div>
  </div>
</div>
<script>
var CATS=[["sum","classes"],["ex","exercises"],["ch","chores"]];
var DAY=864e5;
var S={tasks:[],fin:0,updated:0}, cat="sum", dbDoc=null, saveT=null;

function clean(o){o.tasks=(o.tasks||[]).filter(function(t){return !t.done});o.fin=o.fin||0;return o}
function load(){try{var r=localStorage.getItem("todo-spring");if(r){var o=JSON.parse(r);if(o&&o.tasks)return clean(o)}}catch(e){}return {tasks:[],fin:0,updated:0}}
function save(){S.updated=Date.now();try{localStorage.setItem("todo-spring",JSON.stringify(S))}catch(e){}
  if(dbDoc){clearTimeout(saveT);saveT=setTimeout(function(){dbDoc.set({json:JSON.stringify(S),updated:S.updated}).catch(function(){})},400)}}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function dueTag(d){if(!d)return"";var t=today(),cls="";
  if(d<t)cls=" late";else if(d===t||(new Date(d+"T00:00")-new Date(t+"T00:00"))<=2*DAY)cls=" soon";
  var lbl=d===t?"today":new Date(d+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
  return '<span class="due'+cls+'">'+lbl+'</span>'}
function byDue(a,b){var x=a.due||"9999",y=b.due||"9999";return x<y?-1:x>y?1:0}

function render(){
  var h="";
  CATS.forEach(function(c){
    var items=S.tasks.filter(function(t){return t.c===c[0]}).sort(byDue);
    h+='<div class="sec"><h2><span>'+c[1]+'</span><span>'+items.length+'</span></h2>';
    h+=items.length?items.map(function(t){return '<label class="item"><input type="checkbox" class="cb" data-d="'+t.id+'"><span class="t">'+esc(t.t)+'</span>'+dueTag(t.due)+'<button class="x" data-x="'+t.id+'" title="remove without counting">×</button></label>'}).join(""):'<div class="empty">–</div>';
    h+='</div>'});
  document.getElementById("lists").innerHTML=h;
  var open=S.tasks.length,tot=S.fin+open,pct=tot?Math.round(S.fin/tot*100):0;
  document.getElementById("fill").style.width=pct+"%";
  document.getElementById("pl").textContent=S.fin+" / "+tot+" done";
  document.getElementById("pp").textContent=pct+"%";
}

function chips(){document.getElementById("chips").innerHTML=CATS.map(function(c){return '<button class="chip'+(c[0]===cat?' on':'')+'" data-c="'+c[0]+'">'+c[1]+'</button>'}).join("")}
function add(){var i=document.getElementById("in"),dd=document.getElementById("due"),v=i.value.trim();if(!v)return;
  if(!S.tasks.length)S.fin=0;
  S.tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:v,c:cat,due:dd.value||""});i.value="";dd.value="";save();render()}

document.getElementById("go").onclick=add;
document.getElementById("in").onkeydown=function(e){if(e.key==="Enter")add()};
document.getElementById("chips").onclick=function(e){var c=e.target.getAttribute("data-c");if(c){cat=c;chips()}};
document.body.addEventListener("click",function(e){
  var id=e.target.getAttribute("data-x");
  if(id){e.preventDefault();S.tasks=S.tasks.filter(function(k){return k.id!==id});save();render()}
});
document.getElementById("lists").addEventListener("change",function(e){var id=e.target.getAttribute("data-d");if(!id)return;
  setTimeout(function(){S.tasks=S.tasks.filter(function(k){return k.id!==id});S.fin++;save();render()},250)});

S=load();chips();render();

// optional cloud backup (only when the viewer is signed in to claude.ai)
(async function(){try{
  if(!window.claude)return;
  var db=await claude.use("db"),user=await claude.use("user");if(!db||!user)return;
  var id=await user.id();if(!id)return;
  dbDoc=db.doc("data/users/"+id+"/todo");
  var snap=await dbDoc.get();
  if(snap.exists){var d=snap.data();var r=JSON.parse(d.json);if(r&&r.tasks&&(d.updated||0)>(S.updated||0)){S=clean(r);try{localStorage.setItem("todo-spring",JSON.stringify(S))}catch(e){}render()}}
  else if(S.tasks.length){save()}
}catch(e){}})();
</script>
</body>
</html>
